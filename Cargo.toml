[workspace]
members = [
  "fak-core",
] # Lista de crates que son miembros de este proyecto. La ruta tiene que ser relativa a la raiz.

[workspace.package]
edition = "2024"
rust-version = "1.99"

[package]
name = "lector-humedad"
version = "0.1.0"
authors = ["Ramiro Krapp <contact@krapp.dev>"]
edition.workspace = true
resolver = "2"
rust-version.workspace = true

[lints.rust]
# Flags `let _ = value;` on types with `Drop` (such as `EspSntp` or `EspWifi`):
# `_` drops the value at once, which stops the client. Use a named binding
# (`let _sntp = ...`) to keep it, or `drop(value);` to drop it on purpose.
let_underscore_drop = "warn"

[[bin]]
name = "lector-humedad"
harness = false         # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
fak-core = { path = "fak-core" }
log = "0.4"
esp-idf-svc = { version = "0.54", features = [
  "critical-section",
  "embassy-time-driver",
] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
anyhow = "1.0.104"
tm1637-embedded-hal = "0.5.3"
embassy-futures = "0.1.2"

[build-dependencies]
embuild = "0.33"
fak-core = { path = "fak-core" } # is_bare_host checks sntp_server
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
