[workspace]
members = ["fak-core"] # Lista de crates que son miembros de este proyecto. La ruta tiene que ser relativa a la raiz.

[workspace.package]
edition = "2024"
rust-version = "1.99"

[package]
name = "lector-humedad"
version = "0.1.0"
authors = ["Ramiro Krapp <contact@krapp.dev>"]
edition.workspace = true
resolver = "2"
rust-version.workspace = true

[[bin]]
name = "lector-humedad"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.53", features = ["critical-section", "embassy-time-driver"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
anyhow = "1.0.104"
tm1637-embedded-hal = "0.5.2"

[build-dependencies]
embuild = "0.33"
